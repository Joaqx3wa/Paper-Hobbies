name: Publish Paper Hobbies
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify puzzle generation and booklet imposition
        run: npm test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html favicon.svg style.css app.js engine.js maze.js kakuro.js render.js pdf.js png.js zip.js palette.js themes.js vocabulary.js vocabulary-extra.js pokemon.js pokemon-expanded.js pop-culture.js celebrations.js countries.js english.js typography.js .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
